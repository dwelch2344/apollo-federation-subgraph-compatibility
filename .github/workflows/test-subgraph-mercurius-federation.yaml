name: Mercurius Federation Test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'implementations/mercurius-federation/**'

jobs:
  compatibility:
    uses: ./.github/workflows/test-subgraph.yaml
    with:
      library: "mercurius-federation"

  pr-info:
    uses: ./.github/workflows/save-pr-info.yaml
    with:
      pr_number: ${{ github.event.number }}
